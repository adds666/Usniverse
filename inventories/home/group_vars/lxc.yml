lxc_map:
  # `id` is the logical CT number used in naming and IP conventions.
  # `proxmox_vmid` is the live VMID on the Proxmox host.
  # In steady state they should match; temporary differences are only for in-progress renumbering.
  - id: 110
    proxmox_vmid: 110
    node: pve
    hostname: edge-proxy
    ip: 192.168.1.110/24
    cores: 1
    memory: 1024
    disk_gb: 8
    features:
      - nesting=1
      - keyctl=1
