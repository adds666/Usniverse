proxmox_api_host: 100.69.158.73
proxmox_node: macbookpro

proxmox_api_user: ansible@pve
proxmox_api_realm: pve
proxmox_verify_ssl: false

# stored in vault/vault.yml
proxmox_api_token_id: "{{ vault_proxmox_token_id }}"
proxmox_api_token_secret: "{{ vault_proxmox_token_secret }}"

# Debian 12 LXC template
#lxc_ostemplate: "local:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst"

# Networking for LXCs (LAN-side)
lxc_bridge: vmbr0
lxc_gw: 192.168.1.1
lxc_dns: 192.168.1.1

# SSH pubkey injected into new containers
lxc_ssh_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
