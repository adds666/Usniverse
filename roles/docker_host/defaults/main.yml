---
# Docker inside unprivileged Proxmox LXC needs fuse + relaxed confinement tweaks.
docker_host_enable_fuse_overlayfs: true
docker_host_disable_iptables: true

# Proxmox LXC config tweaks for Docker-in-LXC
docker_host_lxc_apparmor_unconfined: true
docker_host_lxc_mount_proc_sys_rw: true
docker_host_lxc_bind_dev_fuse: true
