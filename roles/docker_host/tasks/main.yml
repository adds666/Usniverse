---
- name: Assert Debian 12
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version | int == 12
    fail_msg: "docker_host is for Debian 12 only"

- name: Ensure apt prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key (dearmored)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o "{{ docker_host_repo_keyring }}"
    chmod 0644 "{{ docker_host_repo_keyring }}"
  args:
    executable: /bin/bash
    creates: "{{ docker_host_repo_keyring }}"
- name: Determine Docker repo architecture
  ansible.builtin.set_fact:
    docker_host_repo_arch: "{{ docker_host_repo_arch_map.get(ansible_facts.architecture, 'amd64') }}"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_host_repo_arch }} signed-by={{ docker_host_repo_keyring }}] https://download.docker.com/linux/debian bookworm stable"
    state: present
    filename: docker

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_host_packages }}"
    state: present
    update_cache: true

- name: Enable and start docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ docker_host_admin_user }}"
    groups: docker
    append: true
  when: docker_host_admin_user is defined and docker_host_admin_user | length > 0

- name: Verify docker is usable (version)
  ansible.builtin.command: docker --version
  register: docker_host_docker_version
  changed_when: false

- name: Verify compose plugin is usable (version)
  ansible.builtin.command: docker compose version
  register: docker_host_compose_version
  changed_when: false
