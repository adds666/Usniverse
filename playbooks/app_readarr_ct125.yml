---
- name: Deploy Readarr on CT125
  hosts: ct125
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure Readarr config directory exists
      ansible.builtin.file:
        path: /opt/readarr/config
        state: directory
        owner: admin
        group: admin
        mode: "0755"

  roles:
    - role: docker_compose_app
      vars:
        docker_compose_app_name: readarr
        docker_compose_app_owner: admin
        docker_compose_app_group: admin
        docker_compose_app_env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/London"
          UMASK: "002"
        docker_compose_app_compose_yml: |
          services:
            readarr:
              image: ghcr.io/linuxserver/readarr:develop-0.4.18.2805-ls157
              container_name: readarr
              network_mode: host
              environment:
                - PUID=${PUID}
                - PGID=${PGID}
                - TZ=${TZ}
                - UMASK=${UMASK}
              volumes:
                - ./config:/config
                - /mnt/Global_Share/Media/Torrents_Unsorted:/downloads
                - /mnt/Global_Share/private:/books
              restart: unless-stopped
