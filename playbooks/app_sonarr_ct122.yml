---
- name: Deploy Sonarr on CT122
  hosts: ct122
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure Sonarr config directory exists
      ansible.builtin.file:
        path: /opt/sonarr/config
        state: directory
        owner: admin
        group: admin
        mode: "0755"

  roles:
    - role: docker_compose_app
      vars:
        docker_compose_app_name: sonarr
        docker_compose_app_owner: admin
        docker_compose_app_group: admin
        docker_compose_app_env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/London"
          UMASK: "002"
        docker_compose_app_compose_yml: |
          services:
            sonarr:
              image: lscr.io/linuxserver/sonarr:latest
              container_name: sonarr
              network_mode: host
              environment:
                - PUID=${PUID}
                - PGID=${PGID}
                - TZ=${TZ}
                - UMASK=${UMASK}
              volumes:
                - ./config:/config
                - /mnt/Global_Share/Media/Torrents_Unsorted:/downloads
                - /mnt/Global_Share/Media/Movies/TV Series:/tv
              restart: unless-stopped
