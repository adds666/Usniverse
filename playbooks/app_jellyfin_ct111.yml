---
- name: Deploy Jellyfin on CT111 (compose-only, no data yet)
  hosts: ct111
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure host directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: admin
        group: admin
        mode: "0755"
      loop:
        - /opt/jellyfin
        - /opt/jellyfin/config
        - /data/transcode

    - name: Normalize ownership on Jellyfin writable paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: admin
        group: admin
        recurse: true
      loop:
        - /opt/jellyfin/config
        - /data/transcode
      register: jellyfin_writable_paths

  roles:
    - role: docker_compose_app
      vars:
        docker_compose_app_name: "jellyfin"
        docker_compose_app_owner: "admin"
        docker_compose_app_group: "admin"
        docker_compose_app_env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/London"

        docker_compose_app_compose_yml: |
          services:
            jellyfin:
              image: lscr.io/linuxserver/jellyfin:latest
              container_name: jellyfin
              network_mode: host
              environment:
                - PUID=${PUID}
                - PGID=${PGID}
                - TZ=${TZ}
              volumes:
                - ./config:/config
                - /mnt/Global_Share/Media/Movies:/media:ro
                - /mnt/Global_Share/Media/Music:/music:ro
                - /data/transcode:/transcode
              restart: unless-stopped

  post_tasks:
    - name: Recreate Jellyfin after permission repair
      ansible.builtin.command: docker compose up -d --force-recreate
      args:
        chdir: /opt/jellyfin
      changed_when: true
      when: jellyfin_writable_paths is changed
