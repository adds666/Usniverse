---
- name: Set stable qBittorrent WebUI credentials on CT129
  hosts: ct129
  become: true
  gather_facts: false

  tasks:
    - name: Ensure qBittorrent accepts the vaulted admin password
      ansible.builtin.shell: |
        set -euo pipefail
        COOKIE="$(mktemp)"
        trap 'rm -f "$COOKIE"' EXIT

        login() {
          local password="$1"
          curl -sS -o /dev/null -w '%{http_code}' -c "$COOKIE" \
            --data "username={{ qbittorrent_webui_username }}&password=${password}" \
            "http://127.0.0.1:{{ qbittorrent_webui_port }}/api/v2/auth/login"
        }

        login_ok() {
          case "$1" in
            2*) return 0 ;;
            *) return 1 ;;
          esac
        }

        if login_ok "$(login '{{ qbittorrent_webui_password }}')"; then
          exit 0
        fi

        TMP_PASSWORD="$(docker logs qbittorrent 2>&1 | sed -n 's/.*temporary password is provided for this session: //p' | tail -n1)"
        [ -n "$TMP_PASSWORD" ]

        rm -f "$COOKIE"
        touch "$COOKIE"
        login_ok "$(login "$TMP_PASSWORD")"

        curl -fsS -b "$COOKIE" \
          --data-urlencode 'json={"web_ui_username":"{{ qbittorrent_webui_username }}","web_ui_password":"{{ qbittorrent_webui_password }}"}' \
          "http://127.0.0.1:{{ qbittorrent_webui_port }}/api/v2/app/setPreferences" >/dev/null

        rm -f "$COOKIE"
        touch "$COOKIE"
        login_ok "$(login '{{ qbittorrent_webui_password }}')"
      args:
        executable: /bin/bash
      no_log: true

- name: Configure Sonarr on CT122
  hosts: ct122
  become: true
  gather_facts: false

  vars:
    sonarr_root_path: /tv
    sonarr_category: tv-sonarr

  tasks:
    - name: Read Sonarr API key from config.xml
      ansible.builtin.slurp:
        src: /opt/sonarr/config/config.xml
      register: sonarr_config

    - name: Set Sonarr API key fact
      ansible.builtin.set_fact:
        sonarr_api_key: "{{ sonarr_config.content | b64decode | regex_search('<ApiKey>([^<]+)</ApiKey>', '\\1') | first }}"

    - name: Query Sonarr root folders
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/rootfolder
        method: GET
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
      register: sonarr_rootfolders

    - name: Add Sonarr root folder
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/rootfolder
        method: POST
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        body_format: json
        body:
          path: "{{ sonarr_root_path }}"
        status_code: 201
      when: sonarr_rootfolders.json | selectattr('path', 'equalto', sonarr_root_path) | list | length == 0

    - name: Query Sonarr root folders after creation
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/rootfolder
        method: GET
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
      register: sonarr_rootfolders_final

    - name: Query Sonarr download clients
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/downloadclient
        method: GET
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
      register: sonarr_download_clients

    - name: Add qBittorrent download client to Sonarr
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/downloadclient
        method: POST
        headers:
          X-Api-Key: "{{ sonarr_api_key }}"
        body_format: json
        body:
          enable: true
          protocol: torrent
          priority: 1
          removeCompletedDownloads: true
          removeFailedDownloads: true
          name: qBittorrent
          implementationName: qBittorrent
          implementation: QBittorrent
          configContract: QBittorrentSettings
          fields:
            - name: host
              value: 192.168.1.129
            - name: port
              value: 8080
            - name: useSsl
              value: false
            - name: urlBase
              value: /
            - name: username
              value: "{{ hostvars['ct129'].qbittorrent_webui_username }}"
            - name: password
              value: "{{ hostvars['ct129'].qbittorrent_webui_password }}"
            - name: tvCategory
              value: "{{ sonarr_category }}"
            - name: tvImportedCategory
              value: ""
            - name: tvDirectory
              value: /downloads
            - name: recentTvPriority
              value: 0
            - name: olderTvPriority
              value: 0
            - name: initialState
              value: 0
            - name: sequentialOrder
              value: false
            - name: firstAndLast
              value: false
            - name: contentLayout
              value: 0
          tags: []
        status_code: 201
      when: sonarr_download_clients.json | selectattr('implementation', 'equalto', 'QBittorrent') | list | length == 0

