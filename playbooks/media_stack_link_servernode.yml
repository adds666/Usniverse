- name: Configure Bazarr on CT126
  hosts: ct126
  become: true
  gather_facts: false

  tasks:
    - name: Update Bazarr Radarr connection
      ansible.builtin.replace:
        path: /opt/bazarr/config/config/config.yaml
        regexp: '(?ms)^radarr:\n(?:  .*\n)+?(?=^[^ ]|\Z)'
        replace: |
          radarr:
            apikey: '34c28d9573e942109f456f1739af9ffa'
            base_url: /
            defer_search_signalr: false
            excluded_tags: []
            full_update: Daily
            full_update_day: 6
            full_update_hour: 4
            http_timeout: 60
            ip: 192.168.1.123
            movies_sync: 60
            movies_sync_on_live: true
            only_monitored: false
            port: 7878
            ssl: false
            sync_only_monitored_movies: false
            use_ffprobe_cache: true

    - name: Update Bazarr Sonarr connection
      ansible.builtin.replace:
        path: /opt/bazarr/config/config/config.yaml
        regexp: '(?ms)^sonarr:\n(?:  .*\n)+?(?=^[^ ]|\Z)'
        replace: |
          sonarr:
            apikey: '29fac9ca277444a99046373d9912f4f7'
            base_url: /
            defer_search_signalr: false
            exclude_season_zero: false
            excluded_series_types: []
            excluded_tags: []
            full_update: Daily
            full_update_day: 6
            full_update_hour: 4
            http_timeout: 60
            ip: 192.168.1.122
            only_monitored: false
            port: 8989
            series_sync: 60
            series_sync_on_live: true
            ssl: false
            sync_only_monitored_episodes: false
            sync_only_monitored_series: false
            use_ffprobe_cache: true

    - name: Enable Bazarr Sonarr and Radarr integrations
      ansible.builtin.replace:
        path: /opt/bazarr/config/config/config.yaml
        regexp: '(?m)^  use_radarr: false$'
        replace: '  use_radarr: true'

    - name: Enable Bazarr Sonarr integration flag
      ansible.builtin.replace:
        path: /opt/bazarr/config/config/config.yaml
        regexp: '(?m)^  use_sonarr: false$'
        replace: '  use_sonarr: true'

    - name: Restart Bazarr container
      ansible.builtin.command: docker restart bazarr

- name: Configure Prowlarr on CT127
  hosts: ct127
  become: true
  gather_facts: false

  vars:
    prowlarr_api_key: bde691bf5f5c4887a0f374259f14422d

  tasks:
    - name: Query Prowlarr applications
      ansible.builtin.uri:
        url: http://127.0.0.1:9696/api/v1/applications
        method: GET
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
      register: prowlarr_apps

    - name: Query Prowlarr indexer proxies
      ansible.builtin.uri:
        url: http://127.0.0.1:9696/api/v1/indexerProxy
        method: GET
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
      register: prowlarr_proxies

    - name: Add FlareSolverr proxy to Prowlarr
      ansible.builtin.uri:
        url: http://127.0.0.1:9696/api/v1/indexerProxy
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          enable: true
          name: FlareSolverr
          implementationName: FlareSolverr
          implementation: FlareSolverr
          configContract: FlareSolverrSettings
          fields:
            - name: host
              value: http://192.168.1.128:8191/
            - name: requestTimeout
              value: 60
          tags: []
        status_code: 201
      when: prowlarr_proxies.json | selectattr('implementation', 'equalto', 'FlareSolverr') | list | length == 0

    - name: Add Sonarr application to Prowlarr
      ansible.builtin.uri:
        url: http://127.0.0.1:9696/api/v1/applications
        method: POST
        headers:
          X-Api-Key: "{{ prowlarr_api_key }}"
        body_format: json
        body:
          enable: true
          syncLevel: fullSync
          name: Sonarr
          implementationName: Sonarr
          implementation: Sonarr
          configContract: SonarrSettings
          fields:
            - name: prowlarrUrl
              value: http://192.168.1.127:9696
            - name: baseUrl
              value: http://192.168.1.122:8989
