- name: Repoint Ombi to the new Sonarr and Radarr services on CT118
  hosts: ct118
  become: true
  gather_facts: false

  tasks:
    - name: Update Ombi Sonarr settings
      ansible.builtin.shell: |
        set -e
        sqlite3 /opt/ombi/config/OmbiSettings.db <<'SQL'
        UPDATE GlobalSettings
        SET Content='{"Enabled":true,"ApiKey":"29fac9ca277444a99046373d9912f4f7","QualityProfile":"4","SeasonFolders":true,"RootPath":"1","SendUserTags":false,"AddOnly":false,"LanguageProfile":1,"LanguageProfileAnime":0,"ScanForAvailability":false,"PrioritizeArrAvailability":false,"Ssl":false,"Ip":"192.168.1.122","Port":8989,"Id":4}'
        WHERE SettingsName='SonarrSettings';
        SQL
      args:
        executable: /bin/bash

    - name: Update Ombi Radarr settings
      ansible.builtin.shell: |
        set -e
        sqlite3 /opt/ombi/config/OmbiSettings.db <<'SQL'
        UPDATE GlobalSettings
        SET Content='{"Enabled":true,"ApiKey":"34c28d9573e942109f456f1739af9ffa","DefaultQualityProfile":"4","DefaultRootPath":"/movies","AddOnly":false,"MinimumAvailability":"Released","ScanForAvailability":true,"PrioritizeArrAvailability":false,"SendUserTags":false,"Ssl":false,"Ip":"192.168.1.123","Port":7878,"Id":5}'
        WHERE SettingsName='RadarrSettings';
        SQL
      args:
        executable: /bin/bash

    - name: Restart Ombi container
      ansible.builtin.command: docker restart ombi
