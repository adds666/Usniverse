---
- name: Update all Docker Compose projects on Docker LXCs
  hosts: docker_lxc
  become: true
  gather_facts: false

  vars:
    compose_roots:
      - /opt
      - /home
      - /srv
      - /var/lib

  tasks:
    - name: Skip if docker not installed
      ansible.builtin.shell: "command -v docker >/dev/null 2>&1"
      register: docker_present
      changed_when: false
      failed_when: false

    - name: Find active compose files from Docker metadata
      ansible.builtin.shell: |
        set -eu
        docker compose ls --format json | python3 -c '
        import json, sys
        try:
            data = json.load(sys.stdin)
        except Exception:
            data = []
        seen = []
        for item in data:
            config_files = str(item.get("ConfigFiles", ""))
            for path in config_files.split(","):
                path = path.strip()
                if path and path not in seen:
                    seen.append(path)
        print("\n".join(seen))
        '
      args:
        executable: /bin/bash
      register: compose_find
      changed_when: false
      failed_when: false
      when: docker_present.rc == 0

    - name: Update each compose project (pull + up)
      ansible.builtin.shell: |
        set -euo pipefail
        d="$(dirname "{{ item }}")"
        echo "--- updating in: $d"
        cd "$d"
        docker compose pull
        docker compose up -d --remove-orphans
      args:
        executable: /bin/bash
      loop: "{{ compose_find.stdout_lines | default([]) }}"
      when:
        - docker_present.rc == 0
        - (compose_find.stdout | default('') | length) > 0

    - name: Prune dangling images
      ansible.builtin.shell: "docker image prune -f"
      when: docker_present.rc == 0
