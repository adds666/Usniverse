- name: Create LXCs on Proxmox via SSH (pct/pveam)
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../inventories/home/group_vars/proxmox.yml
    - ../inventories/home/group_vars/lxc.yml

  tasks:
    - name: Refresh template list
      ansible.builtin.command: pveam update
      changed_when: false

    - name: Ensure a Debian 12 template is downloaded
      ansible.builtin.shell: |
        set -euo pipefail
        if ! pveam list local | grep -q debian-12; then
          TPL=$(pveam available --section system | awk '/debian-12/ {print $2}' | head -n1)
          echo "Downloading: $TPL"
          pveam download local "$TPL"
        else
          echo "Debian 12 template already present"
        fi
      changed_when: false

    - name: Discover Debian 12 template filename (strip storage prefix)
      ansible.builtin.shell: |
        set -euo pipefail
        pveam list local | awk '/debian-12/ {print $1}' | head -n1 | sed 's#^local:vztmpl/##'
      register: deb12_tpl
      changed_when: false

    - name: Assert template found
      ansible.builtin.assert:
        that:
          - deb12_tpl.stdout is match('^debian-12-.*\\.tar\\.(gz|xz|zst)$')
        fail_msg: "Could not detect a Debian 12 template filename. Got: {{ deb12_tpl.stdout }}"

    - name: Stage SSH public key on Proxmox host
      ansible.builtin.copy:
        dest: /root/ansible_pubkey.pub
        content: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
        mode: '0600'

    - name: Check if CT already exists anywhere in the cluster
      ansible.builtin.shell: |
        test -e /etc/pve/nodes/*/lxc/{{ item.proxmox_vmid | default(item.id) }}.conf && echo "exists" || echo "missing"
      register: ct_exists
      changed_when: false
      loop: "{{ lxc_map }}"
      when:
        - item.node == inventory_hostname
        - lxc_target_ids | default([]) | length == 0 or item.id in (lxc_target_ids | default([]) | list) or (item.proxmox_vmid | default(item.id)) in (lxc_target_ids | default([]) | list)
      loop_control:
        label: "{{ item.id }} (vmid {{ item.proxmox_vmid | default(item.id) }}) {{ item.hostname }}"

    - name: Create CTs that are missing
      ansible.builtin.shell: |
        set -euo pipefail

        FEATURES_ARG=""
        if [ "{{ item.item.features | length }}" -gt 0 ]; then
          FEATURES_ARG="{% set _f = (item.item.features is string) | ternary(item.item.features, (item.item.features | default([])) | join(',')) %}{% if _f | trim | length > 0 %}--features {{ _f }}{% endif %}"
        fi

        pct create {{ item.item.proxmox_vmid | default(item.item.id) }} "local:vztmpl/{{ deb12_tpl.stdout }}" \
          --hostname "{{ item.item.hostname }}" \
          --cores {{ item.item.cores }} \
          --memory {{ item.item.memory }} \
          --swap 0 \
          --rootfs "{{ lxc_rootfs_storage | default('local-lvm') }}:{{ item.item.disk_gb }}" \
          --net0 "name=eth0,bridge={{ lxc_bridge }},ip={{ (item.item.ip is string and '/' in item.item.ip) | ternary(item.item.ip, item.item.ip ~ '/24') }},gw={{ lxc_gw }}" \
          --nameserver "{{ lxc_dns }}" \
          --unprivileged 1 \
          --onboot 1 \
          $FEATURES_ARG \
          --ssh-public-keys /root/ansible_pubkey.pub
      args:
        executable: /bin/bash
      loop: "{{ ct_exists.results }}"
      when:
        - item.stdout is defined
        - item.stdout == "missing"
        - item.item.node == inventory_hostname
        - lxc_target_ids | default([]) | length == 0 or item.item.id in (lxc_target_ids | default([]) | list) or (item.item.proxmox_vmid | default(item.item.id)) in (lxc_target_ids | default([]) | list)
      loop_control:
        label: "{{ item.item.id }} (vmid {{ item.item.proxmox_vmid | default(item.item.id) }}) {{ item.item.hostname }}"

    - name: Start CTs
      ansible.builtin.shell: |
        pct start {{ item.proxmox_vmid | default(item.id) }} || true
      changed_when: false
      loop: "{{ lxc_map }}"
      when:
        - item.node == inventory_hostname
        - lxc_target_ids | default([]) | length == 0 or item.id in (lxc_target_ids | default([]) | list) or (item.proxmox_vmid | default(item.id)) in (lxc_target_ids | default([]) | list)
      loop_control:
        label: "{{ item.id }} (vmid {{ item.proxmox_vmid | default(item.id) }}) {{ item.hostname }}"

    - name: Show CT status
      ansible.builtin.command: pct list
      changed_when: false
