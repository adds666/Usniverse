---
- name: Ensure Proxmox nodes have Global_Share NFS mounted persistently
  hosts: proxmox
  gather_facts: false
  become: true

  vars:
    global_share_server: "{{ nas_server | default('192.168.1.84') }}"
    global_share_export: "/volume1/Global_Share"
    global_share_path: "{{ nas_host_mount_src | default('/mnt/pve/Global_Share') }}"
    global_share_opts: "{{ nas_host_mount_options | default('vers=3,rw,hard,timeo=600,retrans=2,_netdev') }}"

  pre_tasks:
    - name: Verify the existing PVE-managed NFS mount
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --types
          - nfs,nfs4
          - --mountpoint
          - "{{ nas_host_mount_src }}"
      changed_when: false
      when: global_share_managed_by_pve | default(false) | bool

    - name: Leave PVE-managed storage under Proxmox control
      ansible.builtin.meta: end_host
      when: global_share_managed_by_pve | default(false) | bool

  tasks:
    - name: Ensure mountpoint directory exists
      ansible.builtin.file:
        path: "{{ global_share_path }}"
        state: directory
        mode: "0777"

    - name: Ensure nfs-common installed
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Ensure fstab entry present
      ansible.builtin.mount:
        path: "{{ global_share_path }}"
        src: "{{ global_share_server }}:{{ global_share_export }}"
        fstype: nfs
        opts: "{{ global_share_opts }}"
        state: present

    - name: Ensure mount is active now
      ansible.builtin.mount:
        path: "{{ global_share_path }}"
        src: "{{ global_share_server }}:{{ global_share_export }}"
        fstype: nfs
        opts: "{{ global_share_opts }}"
        state: mounted
