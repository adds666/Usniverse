---
- name: Maintain existing Homepage services and search
  hosts: ct110
  become: true
  gather_facts: true

  vars:
    homepage_matrix_url: "{{ edge_proxy_public_base_url }}:8008"
    servernode_ip: "192.168.1.104"

  tasks:
    - name: Ensure Homepage config directory exists
      ansible.builtin.file:
        path: "{{ homepage_config_dir }}"
        state: directory
        owner: admin
        group: admin
        mode: "0755"

    - name: Ensure Homepage widgets.yaml contains SearXNG search widget
      ansible.builtin.blockinfile:
        path: "{{ homepage_config_dir }}/widgets.yaml"
        create: true
        backup: true
        marker: "# {mark} USNIVERSE MANAGED SEARCH WIDGET"
        insertafter: EOF
        block: |
          - search:
              provider: custom
              url: {{ edge_proxy_public_base_url }}:8080/search?q=
              target: _blank
      register: homepage_widgets

    - name: Check if Homepage services.yaml already exists
      ansible.builtin.stat:
        path: "{{ homepage_config_dir }}/services.yaml"
      register: homepage_services_file

    - name: Read existing Homepage services.yaml
      ansible.builtin.slurp:
        path: "{{ homepage_config_dir }}/services.yaml"
      no_log: true
      register: homepage_services_slurp
      when: homepage_services_file.stat.exists

    - name: Parse existing Homepage groups as YAML
      no_log: true
      ansible.builtin.set_fact:
        homepage_existing_media: "{{ ((homepage_services_slurp.content | b64decode | from_yaml | selectattr('Media', 'defined') | first | default({})).get('Media', [])) | combine }}"
        homepage_existing_servernode: "{{ ((homepage_services_slurp.content | b64decode | from_yaml | selectattr('ServerNode', 'defined') | first | default({})).get('ServerNode', [])) | combine }}"
      when: homepage_services_file.stat.exists

    - name: Preserve existing Homepage widget and action values
      no_log: true
      ansible.builtin.set_fact:
        homepage_wol_url: "{{ homepage_existing_servernode.get('Wake ServerNode', {}).get('href', '') }}"
        homepage_shutdown_url: "{{ homepage_existing_servernode.get('Shutdown ServerNode', {}).get('href', '') }}"
        homepage_jellyfin_widget_key: "{{ homepage_existing_media.get('Jellyfin', {}).get('widget', {}).get('key', '') }}"
        homepage_ombi_widget_key: "{{ homepage_existing_media.get('Ombi', {}).get('widget', {}).get('key', '') }}"
        homepage_openclaw_url: "{{ homepage_existing_servernode.get('OpenClaw', {}).get('href', edge_proxy_public_base_url ~ ':18789') }}"
        homepage_openclaw_site_monitor: "{{ homepage_existing_servernode.get('OpenClaw', {}).get('siteMonitor', edge_proxy_public_base_url ~ ':18789') }}"
      when: homepage_services_file.stat.exists

    - name: Set Homepage defaults when no prior services file exists
      ansible.builtin.set_fact:
        homepage_wol_url: ""
        homepage_shutdown_url: ""
        homepage_jellyfin_widget_key: ""
        homepage_ombi_widget_key: ""
        homepage_openclaw_url: "{{ edge_proxy_public_base_url }}:18789"
        homepage_openclaw_site_monitor: "{{ edge_proxy_public_base_url }}:18789"
      when: not homepage_services_file.stat.exists

    - name: Validate rendered Homepage YAML before writing
      no_log: true
      ansible.builtin.assert:
        that:
          - lookup('template', '../roles/homepage_services/templates/services.yaml.j2') | from_yaml is sequence

    - name: Render managed Homepage services layout
      no_log: true
      ansible.builtin.template:
        src: ../roles/homepage_services/templates/services.yaml.j2
        dest: "{{ homepage_config_dir }}/services.yaml"
        owner: admin
        group: admin
        mode: "0644"
        backup: true
      register: homepage_services

    - name: Check if Homepage container exists
      ansible.builtin.command: docker container inspect {{ homepage_container_name }}
      no_log: true
      register: homepage_container
      failed_when: false
      changed_when: false

    - name: Restart Homepage container after config changes
      ansible.builtin.command: docker restart {{ homepage_container_name }}
      when:
        - homepage_container.rc == 0
        - homepage_widgets is changed or homepage_services is changed

    - name: Refresh Homepage generated page after layout updates
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/revalidate
        headers:
          Host: "{{ edge_proxy_public_base_url | urlsplit('hostname') }}:3000"
      register: homepage_revalidate
      until: homepage_revalidate.status == 200
      retries: 10
      delay: 2
      when:
        - homepage_container.rc == 0
        - homepage_widgets is changed or homepage_services is changed
