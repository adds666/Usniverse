---
- name: Configure existing Homepage on ct110 to use ct119 SearXNG
  hosts: ct110
  become: true
  gather_facts: true

  vars:
    earls_wol_port: 8787

  tasks:
    - name: Ensure Homepage config directory exists
      ansible.builtin.file:
        path: "{{ homepage_config_dir }}"
        state: directory
        owner: admin
        group: admin
        mode: "0755"

    - name: Ensure Homepage widgets.yaml contains SearXNG search widget
      ansible.builtin.blockinfile:
        path: "{{ homepage_config_dir }}/widgets.yaml"
        create: true
        backup: true
        marker: "# {mark} USNIVERSE MANAGED SEARCH WIDGET"
        insertafter: EOF
        block: |
          - search:
              provider: custom
              url: {{ edge_proxy_public_base_url }}:8080/search?q=
              target: _blank
      register: homepage_widgets

    - name: Ensure Homepage services.yaml contains AI search entries
      ansible.builtin.blockinfile:
        path: "{{ homepage_config_dir }}/services.yaml"
        create: true
        backup: true
        marker: "# {mark} USNIVERSE MANAGED AI SEARCH GROUP"
        insertafter: EOF
        block: |
          - AI Search:
              - SearXNG:
                  href: "{{ edge_proxy_public_base_url }}:8080"
                  description: Dedicated search engine exposed through edge-proxy for remote users
      register: homepage_services

    - name: Remove old unmanaged ComfyUI Homepage entry
      ansible.builtin.replace:
        path: "{{ homepage_config_dir }}/services.yaml"
        regexp: '(?ms)^    - ComfyUI:\n        href: http://100\.122\.95\.117:8188\n        description: Node-based image workflow UI\n'
        replace: ''
      register: homepage_comfyui_cleanup

    - name: Remove old unmanaged edge-proxy Server Control entries
      ansible.builtin.replace:
        path: "{{ homepage_config_dir }}/services.yaml"
        regexp: '(?ms)^- Server Control:\n    - Wake ServerNode:\n        icon: mdi-power\n        href: "http://100\.122\.95\.117:8787/wol\?token=[^"]+"\n        ping: 192\.168\.1\.104\n        description: "WOL via edge-proxy webhook"\n\n    - Shutdown ServerNode:\n        icon: mdi-power-off\n        href: "http://100\.122\.95\.117:8787/shutdown\?token=[^"]+"\n        description: "Shutdown via edge-proxy webhook"\n        ping: 192\.168\.1\.104\n\n'
        replace: ''
      register: homepage_old_server_control_cleanup

    - name: Ensure Homepage services.yaml contains Server Control entries
      ansible.builtin.blockinfile:
        path: "{{ homepage_config_dir }}/services.yaml"
        create: true
        backup: true
        marker: "# {mark} USNIVERSE MANAGED SERVER CONTROL GROUP"
        insertafter: EOF
        block: |
          - Server Control:
              - Wake ServerNode:
                  icon: mdi-power
                  href: "http://{{ earls_wol_host }}:{{ earls_wol_port }}/wol?token={{ earls_wol_token }}"
                  ping: 192.168.1.104
                  description: WOL via earls-edge01 relay

              - Shutdown ServerNode:
                  icon: mdi-power-off
                  href: "http://{{ earls_wol_host }}:{{ earls_wol_port }}/shutdown?token={{ earls_wol_token }}"
                  ping: 192.168.1.104
                  description: Shutdown via earls-edge01 relay
      register: homepage_server_control

    - name: Check if Homepage container exists
      ansible.builtin.command: docker container inspect {{ homepage_container_name }}
      register: homepage_container
      failed_when: false
      changed_when: false

    - name: Restart Homepage container after config changes
      ansible.builtin.command: docker restart {{ homepage_container_name }}
      when:
        - homepage_container.rc == 0
        - homepage_widgets is changed or homepage_services is changed or homepage_server_control is changed or homepage_old_server_control_cleanup is changed or homepage_comfyui_cleanup is changed
