---
- name: Deploy OpenClaw on ct121 (build local image from upstream repo)
  hosts: ct121
  become: true
  gather_facts: true

  vars:
    openclaw_version: "2026.9.6"
    openclaw_image: "openclaw:{{ openclaw_version }}-local"
    openclaw_dir: /opt/openclaw
    openclaw_src_dir: /opt/openclaw/src
    openclaw_cfg_dir: /opt/openclaw/data/config
    openclaw_ws_dir: /opt/openclaw/data/workspace

  tasks:
    - name: Ensure prerequisite packages are present
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true

    - name: Ensure OpenClaw directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: admin
        group: admin
        mode: "0755"
      loop:
        - "{{ openclaw_dir }}"
        - "{{ openclaw_src_dir }}"
        - "{{ openclaw_cfg_dir }}"
        - "{{ openclaw_ws_dir }}"

    - name: Clone OpenClaw upstream repo
      ansible.builtin.git:
        repo: https://github.com/openclaw/openclaw.git
        dest: "{{ openclaw_src_dir }}"
        version: "v{{ openclaw_version }}"
        update: true
        force: true

    # Nested Docker on this LXC filesystem does not support pnpm hardlinks.
    - name: Use copy imports for locked pnpm dependencies
      ansible.builtin.replace:
        path: "{{ openclaw_src_dir }}/Dockerfile"
        regexp: 'pnpm install --frozen-lockfile(?! --config.package-import-method=copy)'
        replace: 'pnpm install --frozen-lockfile --config.package-import-method=copy'

    # Temporarily allow 16 GiB CT memory for compilation; restore 4 GiB afterwards.
    - name: Build local OpenClaw image
      ansible.builtin.shell: |
        set -e
        cd "{{ openclaw_src_dir }}"
        docker build -t "{{ openclaw_image }}" .
      args:
        executable: /bin/bash

    - name: Write OpenClaw compose file
      ansible.builtin.copy:
        dest: "{{ openclaw_dir }}/docker-compose.yml"
        owner: admin
        group: admin
        mode: "0644"
        content: |
          services:
            openclaw-gateway:
              image: "{{ openclaw_image }}"
              container_name: openclaw-gateway
              environment:
                HOME: /home/node
                TERM: xterm-256color
                TZ: Europe/London
              volumes:
                - {{ openclaw_cfg_dir }}:/home/node/.openclaw
                - {{ openclaw_ws_dir }}:/home/node/.openclaw/workspace
              ports:
                - "18789:18789"
                - "18790:18790"
              init: true
              restart: unless-stopped
              command: ["node","dist/index.js","gateway","--bind","lan","--port","18789","--allow-unconfigured"]
              healthcheck:
                test: ["CMD","node","-e","fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 30s
                timeout: 5s
                retries: 5
                start_period: 20s

            openclaw-cli:
              image: "{{ openclaw_image }}"
              container_name: openclaw-cli
              network_mode: "service:openclaw-gateway"
              environment:
                HOME: /home/node
                TERM: xterm-256color
                TZ: Europe/London
                BROWSER: echo
              volumes:
                - {{ openclaw_cfg_dir }}:/home/node/.openclaw
                - {{ openclaw_ws_dir }}:/home/node/.openclaw/workspace
              init: true
              restart: unless-stopped
              command: ["sleep","infinity"]

    - name: Write OpenClaw config
      ansible.builtin.copy:
        dest: "{{ openclaw_cfg_dir }}/config.yml"
        owner: admin
        group: admin
        mode: "0644"
        content: |
          gateway:
            host: "0.0.0.0"
            port: 18789
            controlUi:
              allowedOrigins:
                - "http://100.122.95.117:18789"
                - "http://192.168.1.121:18789"

          hands:
            shell:
              enabled: true
              timeout: 30000
              blocked_commands: []
            browser:
              enabled: true
              headless: true
              timeout: 60000
              allowed_domains: []
            filesystem:
              writable_paths:
                - "/home/node/.openclaw/workspace"

          heartbeat:
            enabled: false

    - name: Bring OpenClaw up
      ansible.builtin.shell: |
        set -e
        cd "{{ openclaw_dir }}"
        docker compose up -d
      args:
        executable: /bin/bash
