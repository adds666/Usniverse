---
- name: Deploy FlareSolverr on CT128
  hosts: ct128
  become: true
  gather_facts: false

  roles:
    - role: docker_compose_app
      vars:
        docker_compose_app_name: flaresolverr
        docker_compose_app_owner: admin
        docker_compose_app_group: admin
        docker_compose_app_env:
          TZ: "Europe/London"
          LOG_LEVEL: "info"
          LOG_HTML: "false"
          CAPTCHA_SOLVER: "none"
        docker_compose_app_compose_yml: |
          services:
            flaresolverr:
              image: ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
              container_name: flaresolverr
              network_mode: host
              environment:
                - TZ=${TZ}
                - LOG_LEVEL=${LOG_LEVEL}
                - LOG_HTML=${LOG_HTML}
                - CAPTCHA_SOLVER=${CAPTCHA_SOLVER}
              restart: unless-stopped
