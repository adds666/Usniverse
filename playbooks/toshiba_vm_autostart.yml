---
- name: Keep Toshiba legacy VMs on manual startup
  hosts: toshiba
  gather_facts: false
  tasks:
    - name: Read reviewed VM configurations
      ansible.builtin.command: 'qm config {{ item.id }}'
      loop:
        - {id: 100, name: UbuntuVM}
        - {id: 101, name: KaliVM}
      register: vm_boot_configs
      changed_when: false
    - name: Verify VM identities
      ansible.builtin.assert:
        that: "('name: ' + item.item.name) in item.stdout_lines"
      loop: '{{ vm_boot_configs.results }}'
      loop_control:
        label: '{{ item.item.name }}'
    - name: Disable automatic startup without deleting disks or changing backup coverage
      ansible.builtin.command: 'qm set {{ item.item.id }} --onboot 0'
      when: "'onboot: 0' not in item.stdout_lines"
      loop: '{{ vm_boot_configs.results }}'
      loop_control:
        label: '{{ item.item.name }}'
