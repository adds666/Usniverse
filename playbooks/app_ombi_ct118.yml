---
- name: Deploy Ombi on CT118
  hosts: ct118
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure Ombi config directory exists
      ansible.builtin.file:
        path: /opt/ombi/config
        state: directory
        owner: admin
        group: admin
        mode: "0755"

  roles:
    - role: docker_compose_app
      vars:
        docker_compose_app_name: ombi
        docker_compose_app_owner: admin
        docker_compose_app_group: admin
        docker_compose_app_env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Europe/London"
        docker_compose_app_compose_yml: |
          services:
            ombi:
              image: lscr.io/linuxserver/ombi:latest
              container_name: ombi
              network_mode: host
              environment:
                - PUID=${PUID}
                - PGID=${PGID}
                - TZ=${TZ}
              volumes:
                - ./config:/config
              restart: unless-stopped
