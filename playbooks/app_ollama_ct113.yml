---
- name: Verify bare-metal Ollama on ct113
  hosts: ct113
  become: true
  gather_facts: false

  tasks:
    - name: Check ollama service is active
      ansible.builtin.command: systemctl is-active ollama
      register: ollama_active
      changed_when: false
      failed_when: ollama_active.stdout | trim != "active"

    - name: Check ollama service is enabled
      ansible.builtin.command: systemctl is-enabled ollama
      register: ollama_enabled
      changed_when: false
      failed_when: ollama_enabled.stdout | trim != "enabled"

    - name: Probe Ollama API
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/version
        return_content: true
      register: ollama_api
      changed_when: false

    - name: Show Ollama version
      ansible.builtin.debug:
        msg: "Bare-metal Ollama is active on ct113: {{ ollama_api.content }}"
